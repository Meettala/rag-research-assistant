name: Import evaluation bundle

on:
  push:
    branches:
      - agent/evaluation-and-abstention
    paths:
      - .automation/parts/part-00
      - .github/workflows/import-evaluation-bundle.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/evaluation-and-abstention
          fetch-depth: 0

      - name: Decode supplied bundle
        run: |
          mkdir -p /tmp/rag-eval-bundle
          cat .automation/parts/part-* | base64 --decode > /tmp/rag-eval.zip
          unzip -q /tmp/rag-eval.zip -d /tmp/rag-eval-bundle

      - name: Copy evaluation-only files
        run: |
          rm -rf eval
          cp -R /tmp/rag-eval-bundle/eval ./eval
          cp /tmp/rag-eval-bundle/vitest.eval.config.ts ./vitest.eval.config.ts
          cp /tmp/rag-eval-bundle/package.json ./package.json
          cp /tmp/rag-eval-bundle/.github/workflows/ci.yml ./.github/workflows/ci.yml
          cp /tmp/rag-eval-bundle/docs/evaluation.md ./docs/evaluation.md
          rm -rf .automation
          rm .github/workflows/import-evaluation-bundle.yml

      - name: Commit permanent evaluation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add measured RAG evaluation harness and CI gate"
          git push origin HEAD:agent/evaluation-and-abstention
