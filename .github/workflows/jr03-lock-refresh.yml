name: JR03 lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'jr03/rag-job-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out JR03 branch
        uses: actions/checkout@v4
        with:
          ref: jr03/rag-job-readiness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh fixable lockfile packages
        run: npm update --package-lock-only brace-expansion browserslist js-yaml nanoid postcss

      - name: Verify regenerated installation
        run: |
          npm ci
          npm audit --omit=dev
          npm explain nanoid
          npm explain postcss
          npm explain brace-expansion
          npm explain browserslist
          npm explain js-yaml

      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh security-patched dependency lockfile"
          git push origin HEAD:jr03/rag-job-readiness
