name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Capture production dependency audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --legacy-peer-deps --json > npm-audit.json
          status=$?
          echo "$status" > npm-audit-status.txt
          exit 0

      - name: Upload dependency audit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-diagnostics
          path: |
            npm-audit.json
            npm-audit-status.txt
          retention-days: 3

      - name: Enforce production dependency audit
        run: test "$(cat npm-audit-status.txt)" -eq 0
