name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out JR03 branch
        uses: actions/checkout@v4
        with:
          ref: jr03/rag-job-readiness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh fixable lockfile packages
        run: npm update --package-lock-only brace-expansion browserslist js-yaml nanoid postcss

      - name: Install regenerated dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify remediated dependency chains
        run: |
          npm explain nanoid
          npm explain postcss
          npm explain brace-expansion
          npm explain browserslist
          npm explain js-yaml

      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh security-patched dependency lockfile"
            git push origin HEAD:jr03/rag-job-readiness
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run evaluation
        run: npm run eval

      - name: Build production application
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t rag-research-assistant .

      - name: Verify non-root image configuration
        run: test "$(docker inspect --format '{{.Config.User}}' rag-research-assistant)" = "nextjs"

      - name: Smoke-test homepage without provider keys
        run: |
          container_id=$(docker run -d -p 3000:3000 rag-research-assistant)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

  dependency-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
