[[IgnoredVulns]]
id = "CVE-2026-14257"
reason = "brace-expansion versions below 5.0.8 are pulled only by ESLint/minimatch development tooling. They are not included in the standalone production runtime, and this repository does not pass user-controlled glob patterns to that tooling. Forcing brace-expansion 5 into minimatch 3 breaks ESLint because the APIs are incompatible. Revisit and remove this exception when the upstream lint dependency chain supports brace-expansion 5.0.8 or later."
