<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RAG Research Assistant architecture</title>
  <desc id="desc">Flow from document and question through validation, chunking, retrieval, grounded answering and citations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="70" y="78" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34" font-weight="700">RAG Research Assistant</text>
  <text x="70" y="116" fill="#67e8f9" font-family="Arial, sans-serif" font-size="18">Evidence-first retrieval with validated citations</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 190)">
      <rect width="190" height="110" rx="18" fill="#172033" stroke="#334155"/>
      <text x="95" y="45" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">Document +</text>
      <text x="95" y="72" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">question</text>
    </g>
    <g transform="translate(310 190)">
      <rect width="190" height="110" rx="18" fill="#172033" stroke="#334155"/>
      <text x="95" y="45" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">Strict request</text>
      <text x="95" y="72" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">validation</text>
    </g>
    <g transform="translate(550 190)">
      <rect width="190" height="110" rx="18" fill="#172033" stroke="#334155"/>
      <text x="95" y="45" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">Chunking +</text>
      <text x="95" y="72" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">TF-IDF retrieval</text>
    </g>
    <g transform="translate(790 190)">
      <rect width="190" height="110" rx="18" fill="#172033" stroke="#334155"/>
      <text x="95" y="45" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">Evidence</text>
      <text x="95" y="72" fill="#e2e8f0" text-anchor="middle" font-size="19" font-weight="700">threshold</text>
    </g>
    <g transform="translate(940 390)">
      <rect width="190" height="110" rx="18" fill="#083344" stroke="#22d3ee"/>
      <text x="95" y="45" fill="#cffafe" text-anchor="middle" font-size="19" font-weight="700">Cited answer +</text>
      <text x="95" y="72" fill="#cffafe" text-anchor="middle" font-size="19" font-weight="700">metadata</text>
    </g>
    <g transform="translate(620 390)">
      <rect width="250" height="110" rx="18" fill="#172033" stroke="#334155"/>
      <text x="125" y="40" fill="#e2e8f0" text-anchor="middle" font-size="18" font-weight="700">Extractive answer or</text>
      <text x="125" y="68" fill="#e2e8f0" text-anchor="middle" font-size="18" font-weight="700">validated LLM synthesis</text>
    </g>
    <g transform="translate(280 390)">
      <rect width="250" height="110" rx="18" fill="#3f1d2e" stroke="#fb7185"/>
      <text x="125" y="42" fill="#ffe4e6" text-anchor="middle" font-size="18" font-weight="700">Low confidence</text>
      <text x="125" y="70" fill="#ffe4e6" text-anchor="middle" font-size="18" font-weight="700">Not covered—do not guess</text>
    </g>
  </g>
  <g stroke="#67e8f9" stroke-width="4" fill="none">
    <path d="M260 245h50"/><path d="M500 245h50"/><path d="M740 245h50"/><path d="M885 300v55h-140v35"/>
    <path d="M980 245h55v145"/><path d="M870 445h70"/>
  </g>
  <g stroke="#fb7185" stroke-width="4" fill="none"><path d="M885 300v55H405v35"/></g>
  <g fill="#67e8f9"><path d="M310 245l-12-8v16z"/><path d="M550 245l-12-8v16z"/><path d="M790 245l-12-8v16z"/><path d="M745 390l-8-12h16z"/><path d="M940 445l-12-8v16z"/><path d="M1035 390l-8-12h16z"/></g>
  <g fill="#fb7185"><path d="M405 390l-8-12h16z"/></g>
  <text x="70" y="570" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Document text and provider output remain untrusted throughout the pipeline.</text>
</svg>
